<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1060" viewBox="0 0 1520 1060">
  <style>
    text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#262626}
    .title{font-size:40px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:17px;fill:#716f6a}
    .step{font-size:20px;font-weight:700}.label{font-size:13px;fill:#716f6a}.body{font-size:15px}
    .section{font-size:18px;font-weight:700}.value{font-size:28px;font-weight:700}.action{font-size:16px;fill:#fff}
    .card{fill:#fff}.phone{fill:#f6f3ef;stroke:#e2dcd6;stroke-width:2}.primary{fill:#a50034}
    .secondary{fill:#fff;stroke:#a50034}.field{fill:#faf8f5;stroke:#e2dcd6}.muted{fill:#716f6a}
  </style>
  <defs><symbol id="app-mark" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#a50034"/><path d="M64.8,43.1 A21,21 0,1 1,58,38.6" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"/><path d="M50,43 A15,15 0,1 1,50,73 A15,15 0,1 1,50,43" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M69,28 C67,32 63,36 63,39 C63,42.3 65.7,45 69,45 C72.3,45 75,42.3 75,39 C75,36 71,32 69,28 Z" fill="#fff"/></symbol><symbol id="file-mark" viewBox="0 0 24 24"><path d="M6,2 L14,2 L20,8 L20,20 Q20,22 18,22 L6,22 Q4,22 4,20 L4,4 Q4,2 6,2 Z M14,2 L14,8 L20,8 M8,12 L16,12 M8,16 L16,16" fill="none" stroke="#a50034" stroke-width="1.6" stroke-linejoin="round"/></symbol><symbol id="phone-mark" viewBox="0 0 24 24"><path d="M7,2 L17,2 Q19,2 19,4 L19,20 Q19,22 17,22 L7,22 Q5,22 5,20 L5,4 Q5,2 7,2 Z M9,5 L15,5 M11,19 L13,19" fill="none" stroke="#a50034" stroke-width="1.6" stroke-linecap="round"/></symbol><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a50034" stroke-width="1.4"/></marker></defs>
  <rect width="1520" height="1060" fill="#fff"/>
  <text x="40" y="66" class="title">측정에서 기록까지.</text>
  <text x="40" y="103" class="subtitle">접시 건조 센서 · v0.3.1 화면 와이어프레임 · 예시 데이터로 설명하는 사용 흐름입니다.</text>
  <text x="40" y="166" class="step">01. 연결 준비</text>
  <text x="410" y="166" class="step">02. 측정 확인</text>
  <text x="780" y="166" class="step">03. 현재 값 기록</text>
  <text x="1150" y="166" class="step">04. CSV 저장</text>
  <g fill="none" stroke="#a50034" stroke-width="2" marker-end="url(#arrow)"><path d="M356 520H393"/><path d="M726 520H763"/><path d="M1096 520H1133"/></g>

  <g transform="translate(40 193)">
    <rect width="310" height="644" rx="28" class="phone"/>
    <rect x="128" y="12" width="54" height="4" rx="2" fill="#e2dcd6"/>
    <use href="#app-mark" x="20" y="28" width="26" height="26"/><text x="55" y="46" class="label" style="letter-spacing:2px;fill:#a50034">DISHDRY</text>
    <text x="226" y="46" class="label">v0.3.1</text>
    <text x="20" y="83" style="font-size:25px;font-weight:700">접시 건조 센서</text>
    <text x="20" y="110" class="label">건조대 주변을 확인하고 기록하세요.</text>
    <rect x="18" y="130" width="274" height="184" rx="22" fill="#fff8f9" stroke="#fbecef"/>
    <use href="#app-mark" x="61" y="144" width="22" height="22"/><rect x="89" y="143" width="132" height="25" rx="12" fill="#fbecef"/><text x="155" y="160" text-anchor="middle" class="label" style="fill:#a50034">실험용 건조 지수</text>
    <text x="137" y="230" text-anchor="middle" style="font-size:56px;fill:#a50034">—</text>
    <text x="185" y="225" class="label">/ 100</text>
    <rect x="38" y="251" width="234" height="4" rx="2" fill="#eae5df"/>
    <text x="155" y="285" text-anchor="middle" class="label">측정을 시작하면 지수를 확인해요.</text>
    <rect x="18" y="330" width="274" height="238" rx="18" class="card"/>
    <text x="38" y="363" class="section">센서 연결</text><rect x="212" y="343" width="60" height="25" rx="12" fill="#fbecef"/><text x="242" y="360" text-anchor="middle" class="label" style="fill:#a50034">대기</text><text x="38" y="386" class="label">측정 중지됨</text>
    <rect x="38" y="420" width="234" height="42" rx="14" class="field"/>
    <text x="38" y="410" style="font-size:10px;fill:#716f6a">ESP32 측정 주소</text><text x="52" y="446" style="font-size:12px;fill:#716f6a">http://192.168.4.1/readings</text>
    <rect x="152" y="476" width="120" height="40" rx="20" class="primary"/>
    <text x="212" y="502" text-anchor="middle" class="action">측정 시작</text>
    <text x="38" y="539" class="label">ESP32 Wi-Fi 연결 후 주소 입력.</text>
    <text x="38" y="558" class="label">비워 두면 휴대폰 센서만 사용합니다.</text>
    <rect x="18" y="584" width="274" height="45" rx="18" class="card"/>
    <use href="#app-mark" x="38" y="592" width="24" height="24"/><text x="70" y="613" class="section">건조대 주변</text>
  </g>

  <g transform="translate(410 193)">
    <rect width="310" height="644" rx="28" class="phone"/>
    <rect x="128" y="12" width="54" height="4" rx="2" fill="#e2dcd6"/>
    <use href="#app-mark" x="20" y="28" width="26" height="26"/><text x="55" y="46" class="label" style="letter-spacing:2px;fill:#a50034">DISHDRY</text><text x="226" y="46" class="label">v0.3.1</text>
    <text x="20" y="83" style="font-size:25px;font-weight:700">접시 건조 센서</text><text x="20" y="110" class="label">건조대 주변을 확인하고 기록하세요.</text>
    <rect x="18" y="130" width="274" height="184" rx="22" fill="#fff8f9" stroke="#fbecef"/>
    <use href="#app-mark" x="61" y="144" width="22" height="22"/><rect x="89" y="143" width="132" height="25" rx="12" fill="#fbecef"/><text x="155" y="160" text-anchor="middle" class="label" style="fill:#a50034">실험용 건조 지수</text>
    <text x="155" y="222" text-anchor="middle" style="font-size:56px;font-weight:700;fill:#a50034">57</text>
    <text x="155" y="246" text-anchor="middle" class="label">/ 100</text>
    <rect x="38" y="263" width="234" height="4" rx="2" fill="#eae5df"/>
    <rect x="38" y="263" width="133" height="4" rx="2" fill="#fd312e"/>
    <text x="155" y="292" text-anchor="middle" class="label">25°C · 습도 50% · 빛 ADC 1000</text>
    <rect x="18" y="330" width="274" height="238" rx="18" class="card"/>
    <text x="38" y="363" class="section">센서 연결</text><rect x="212" y="343" width="60" height="25" rx="12" fill="#fbecef"/><text x="242" y="360" text-anchor="middle" class="label" style="fill:#a50034">수신 중</text><text x="38" y="386" class="label">ESP32 수신: 14:30:00 (예시)</text>
    <rect x="38" y="420" width="234" height="42" rx="14" class="field"/>
    <text x="38" y="410" style="font-size:10px;fill:#716f6a">ESP32 측정 주소</text><text x="52" y="446" style="font-size:12px;fill:#716f6a">http://192.168.4.1/readings</text>
    <rect x="152" y="476" width="120" height="40" rx="20" class="primary"/>
    <text x="212" y="502" text-anchor="middle" class="action">측정 중지</text>
    <text x="38" y="539" class="label">온도·습도·빛 ADC를 확인합니다.</text>
    <text x="38" y="558" class="label">예시 데이터 · 실물 측정값이 아닙니다.</text>
    <rect x="18" y="584" width="274" height="45" rx="18" class="card"/><use href="#app-mark" x="38" y="592" width="24" height="24"/><text x="70" y="613" class="section">건조대 주변 ↓</text>
  </g>

  <g transform="translate(780 193)">
    <rect width="310" height="644" rx="28" class="phone"/>
    <rect x="128" y="12" width="54" height="4" rx="2" fill="#e2dcd6"/>
    <use href="#app-mark" x="20" y="28" width="26" height="26"/><text x="55" y="46" class="label" style="letter-spacing:2px;fill:#a50034">DISHDRY</text><text x="226" y="46" class="label">v0.3.1</text>
    <text x="20" y="86" class="section">현재 값을 기록하세요.</text>
    <text x="20" y="111" class="label">같은 화면의 센서·기록 영역입니다.</text>
    <rect x="18" y="132" width="274" height="164" rx="18" class="card"/>
    <use href="#phone-mark" x="36" y="150" width="20" height="20"/><text x="64" y="168" class="section">휴대폰 센서</text>
    <rect x="30" y="182" width="116" height="70" rx="12" fill="#faf8f5"/><rect x="155" y="182" width="125" height="70" rx="12" fill="#faf8f5"/>
    <text x="40" y="203" class="label">조도 · lx</text><text x="165" y="203" class="label">움직임 · m/s²</text>
    <text x="40" y="237" class="value">320</text><text x="165" y="237" class="value">0.12</text>
    <text x="38" y="277" class="label">예시 데이터 · 휴대폰 수치도 가상 값</text>
    <rect x="18" y="312" width="274" height="229" rx="18" class="card"/>
    <use href="#file-mark" x="36" y="330" width="20" height="20"/><text x="64" y="348" class="section">측정 기록</text>
    <text x="38" y="392" class="value" style="fill:#a50034">3개</text>
    <text x="38" y="420" class="label">최근 기록 · 14:30:10 (예시)</text>
    <text x="38" y="442" class="label">현재 측정값을 한 줄씩 저장합니다.</text>
    <rect x="38" y="457" width="111" height="40" rx="20" class="primary"/><text x="93" y="483" text-anchor="middle" class="action" style="font-size:13px">현재 값 기록</text>
    <rect x="159" y="457" width="113" height="40" rx="20" class="secondary"/><text x="215" y="483" text-anchor="middle" style="font-size:13px;fill:#a50034">CSV 내보내기</text>
    <text x="38" y="524" class="label">유효한 값이 있을 때만 기록 가능</text>
    <text x="20" y="590" class="label">LG AX · 키친에서 치킨먹기</text><text x="20" y="612" class="label">개발: 황대겸</text>
  </g>

  <g transform="translate(1150 193)">
    <rect width="310" height="644" rx="28" class="phone"/>
    <rect x="128" y="12" width="54" height="4" rx="2" fill="#e2dcd6"/>
    <use href="#app-mark" x="20" y="28" width="26" height="26"/><text x="55" y="46" class="label" style="letter-spacing:2px;fill:#a50034">DISHDRY</text><text x="226" y="46" class="label">v0.3.1</text>
    <text x="20" y="86" class="section">CSV 저장 위치 선택</text>
    <text x="20" y="111" class="label">Download · 예시 파일 3개</text>
    <rect x="18" y="132" width="274" height="253" rx="18" class="card"/>
    <text x="38" y="162" class="section">다운로드</text><text x="38" y="184" class="label">파일 목록은 설명용 예시입니다.</text>
    <use href="#file-mark" x="38" y="206" width="24" height="24"/><text x="73" y="221" class="body" style="font-size:13px">dish-dry-01.csv</text><text x="73" y="241" class="label">CSV · 예시 파일</text>
    <line x1="38" y1="254" x2="272" y2="254" stroke="#e2dcd6"/>
    <use href="#file-mark" x="38" y="265" width="24" height="24"/><text x="73" y="280" class="body" style="font-size:13px">dish-dry-02.csv</text><text x="73" y="300" class="label">CSV · 예시 파일</text>
    <line x1="38" y1="313" x2="272" y2="313" stroke="#e2dcd6"/>
    <use href="#file-mark" x="38" y="324" width="24" height="24"/><text x="73" y="339" class="body" style="font-size:13px">dish-dry-03.csv</text><text x="73" y="359" class="label">CSV · 예시 파일</text>
    <text x="20" y="418" class="label">파일 이름</text><rect x="20" y="430" width="270" height="44" rx="12" class="field"/>
    <text x="35" y="458" class="body" style="font-size:14px">dish-dry-readings.csv</text>
    <rect x="194" y="490" width="96" height="40" rx="20" class="primary"/><text x="242" y="516" text-anchor="middle" class="action">저장</text>
    <text x="20" y="579" class="label">저장·취소 후 앱으로 돌아갑니다.</text><text x="20" y="602" class="label">측정을 계속하려면 다시 시작합니다.</text>
  </g>

  <g class="label">
    <text x="40" y="879">ESP32 개발용 Wi-Fi에 먼저 연결합니다.</text><text x="40" y="903">주소가 비어 있으면 휴대폰 센서만 읽습니다.</text>
    <text x="410" y="879">외부 센서는 5초마다 요청합니다.</text><text x="410" y="903">임시 지수는 건조 완료 판정이 아닙니다.</text>
    <text x="780" y="879">미측정 항목은 CSV에서 빈칸으로 남습니다.</text><text x="780" y="903">기록 개수와 최근 시각은 재시작 뒤 유지됩니다.</text>
    <text x="1150" y="879">파일 선택기를 열면 측정이 중지됩니다.</text><text x="1150" y="903">내부 기록은 저장·취소와 관계없이 유지됩니다.</text>
  </g>
  <line x1="40" y1="953" x2="1460" y2="953" stroke="#e2dcd6"/>
  <text x="40" y="993" class="subtitle">LG AX · 키친에서 치킨먹기 / 황대겸</text>
  <text x="40" y="1025" class="label">예시 데이터: 지수 57 · 기록 3개 · CSV 목록. 저장 화면은 스타일 목업이며 실제 시스템 파일 선택기는 기기 디자인을 따릅니다.</text>
</svg>
