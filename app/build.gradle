plugins {
    id 'com.android.application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'com.unknownamed.dishdry'
    compileSdk 35

    defaultConfig {
        applicationId 'com.unknownamed.dishdry'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
