name: Capture running Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build updated Android app
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/capture_screens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-running-screens
          path: |
            app/build/screenshots/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
