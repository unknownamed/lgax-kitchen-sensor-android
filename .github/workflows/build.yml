name: Build Android and sensor firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK and check Android source
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dish-dry-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - name: Install ESP32 board and sensor library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.3
          arduino-cli lib install "DHT sensor library@1.4.6"
      - name: Compile ESP32-C6 sensor firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32c6 firmware/dish_dry_sensor
